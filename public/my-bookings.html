<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đơn đặt phòng của tôi — StayNest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230D9488'/%3E%3Cpath d='M5 12l7-6 7 6M7.5 11v7h3.5v-4h2v4h3.5v-7' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { brand: { teal: '#0D9488', 'teal-dark': '#0F766E', 'teal-soft': '#F0FDFA', rose: '#F43F5E', 'rose-soft': '#FFF1F2' } },
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        boxShadow: { soft: '0 4px 24px -6px rgba(15, 23, 42, 0.08)', lift: '0 20px 40px -12px rgba(15, 23, 42, 0.16)', bar: '0 12px 40px -8px rgba(15, 23, 42, 0.18)' },
      } },
    };
  </script>
</head>

<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
  <div id="appHeader" class="sticky top-0 z-40 w-full border-b border-slate-100 bg-white/85 backdrop-blur-md"></div>

  <main class="mx-auto max-w-5xl px-4 py-10 sm:px-6 lg:px-8">
    <div class="mb-8 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 sm:text-3xl">Đơn đặt phòng của tôi</h1>
        <p id="bookingsCount" class="mt-2 text-sm text-slate-500">Đang tải…</p>
      </div>
    </div>

    <!-- Bộ lọc trạng thái -->
    <div class="mb-8 flex gap-3 overflow-x-auto pb-1">
      <button class="filter-tab rounded-full bg-brand-teal px-5 py-2.5 text-sm font-semibold text-white shadow-soft transition-all duration-200" data-status="">Tất cả</button>
      <button class="filter-tab rounded-full bg-white px-5 py-2.5 text-sm font-semibold text-slate-600 ring-1 ring-slate-200 transition-all duration-200 hover:-translate-y-0.5 hover:ring-brand-teal hover:text-brand-teal" data-status="pending">Chờ xác nhận</button>
      <button class="filter-tab rounded-full bg-white px-5 py-2.5 text-sm font-semibold text-slate-600 ring-1 ring-slate-200 transition-all duration-200 hover:-translate-y-0.5 hover:ring-brand-teal hover:text-brand-teal" data-status="confirmed">Đã xác nhận</button>
      <button class="filter-tab rounded-full bg-white px-5 py-2.5 text-sm font-semibold text-slate-600 ring-1 ring-slate-200 transition-all duration-200 hover:-translate-y-0.5 hover:ring-brand-teal hover:text-brand-teal" data-status="completed">Hoàn thành</button>
      <button class="filter-tab rounded-full bg-white px-5 py-2.5 text-sm font-semibold text-slate-600 ring-1 ring-slate-200 transition-all duration-200 hover:-translate-y-0.5 hover:ring-brand-teal hover:text-brand-teal" data-status="cancelled">Đã hủy</button>
    </div>

    <!-- Loading -->
    <div id="loading" class="py-20 text-center">
      <div class="mx-auto h-10 w-10 animate-spin rounded-full border-4 border-slate-200 border-t-brand-teal"></div>
      <p class="mt-4 text-sm font-semibold text-slate-500">Đang tải đơn đặt phòng…</p>
    </div>

    <!-- Danh sách đơn -->
    <div id="bookingList" class="space-y-5"></div>

    <!-- Trạng thái rỗng -->
    <div id="emptyState" class="hidden rounded-3xl bg-white px-6 py-16 text-center shadow-soft">
      <span class="mx-auto grid h-16 w-16 place-items-center rounded-full bg-slate-100">
        <svg class="h-8 w-8 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      </span>
      <h3 id="emptyTitle" class="mt-5 text-xl font-extrabold text-slate-900">Chưa có đơn đặt phòng nào</h3>
      <p class="mx-auto mt-2 max-w-sm text-sm text-slate-500">Khám phá hàng ngàn homestay đáng yêu và thực hiện chuyến đi đầu tiên của bạn!</p>
      <a href="index.html" class="mt-6 inline-block rounded-xl bg-brand-teal px-8 py-3 text-sm font-bold text-white shadow-soft transition-all duration-200 hover:-translate-y-0.5 hover:bg-brand-teal-dark hover:shadow-lift">Khám phá ngay</a>
    </div>
  </main>

  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/ui.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    let allBookings = [];
    let currentFilter = '';

    function nightsBetween(ci, co) {
      return Math.round((new Date(co) - new Date(ci)) / 86400000);
    }

    async function loadBookings() {
      try {
        const res = await API.get('/bookings/my-bookings');
        allBookings = res.data || [];
        render();
      } catch (err) {
        $('#loading').classList.add('hidden');
        UI.showToast(API.serverMessage(err), 'error');
        allBookings = [];
        render();
      }
    }

    function render() {
      $('#loading').classList.add('hidden');
      const list = currentFilter ? allBookings.filter(b => b.status === currentFilter) : allBookings;
      $('#bookingsCount').textContent = `Bạn có ${allBookings.length} đơn đặt phòng` + (currentFilter ? ` · đang lọc: ${list.length} đơn` : '');

      $('#emptyTitle').textContent = allBookings.length === 0 ? 'Chưa có đơn đặt phòng nào' : 'Không có đơn nào ở trạng thái này';
      $('#emptyState').classList.toggle('hidden', list.length !== 0);

      $('#bookingList').innerHTML = list.map(b => {
        const room = typeof b.roomId === 'object' ? b.roomId : null;
        const img = room ? UI.roomImage(room) : UI.FALLBACK_IMAGES[0];
        const canCancel = b.status === 'pending' || b.status === 'confirmed';
        const city = room?.address?.city || '';
        const payLabel = b.paymentStatus === 'paid' ? 'Đã thanh toán' : b.paymentStatus === 'refunded' ? 'Đã hoàn tiền' : 'Chưa thanh toán';
        return `
        <article class="flex flex-col gap-4 rounded-3xl bg-white p-5 shadow-soft transition-all duration-200 hover:shadow-lift sm:flex-row sm:items-center">
          <img src="${UI.esc(img)}" alt="${UI.esc(room?.name || '')}" class="h-32 w-full rounded-2xl object-cover sm:h-24 sm:w-36" />
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-2">
              <h3 class="truncate text-base font-extrabold text-slate-900">${UI.esc(room?.name || 'Phòng StayNest')}</h3>
              ${UI.bookingBadge(b.status)}
              <span class="inline-flex items-center rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-bold text-slate-600">${payLabel}</span>
            </div>
            <p class="mt-1 flex items-center gap-1 text-xs font-medium text-slate-500">
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              ${UI.esc(city)} · Mã đơn ${UI.esc(String(b._id).slice(-8).toUpperCase())}
            </p>
            <div class="mt-2 flex flex-wrap gap-x-5 gap-y-1 text-sm text-slate-600">
              <span>📅 ${UI.fmtDate(b.checkInDate)} → ${UI.fmtDate(b.checkOutDate)}</span>
              <span>🌙 ${b.numberOfNights} đêm</span>
              <span>👥 ${b.totalGuests} khách</span>
            </div>
            ${b.note ? `<p class="mt-1.5 truncate text-xs text-slate-400">📝 ${UI.esc(b.note)}</p>` : ''}
          </div>
          <div class="flex flex-col items-end gap-2.5 sm:w-44">
            <p class="text-lg font-extrabold text-slate-900">${UI.fmtVND(b.totalPrice)}</p>
            <div class="flex gap-2">
              ${room?._id ? `<a href="room.html?id=${room._id}" class="rounded-xl border border-slate-200 px-3.5 py-2 text-xs font-bold text-slate-600 transition-all duration-200 hover:border-brand-teal hover:text-brand-teal">Xem phòng</a>` : ''}
              ${canCancel ? `<button data-booking-id="${b._id}" class="cancel-btn rounded-xl border border-brand-rose/30 bg-brand-rose-soft px-3.5 py-2 text-xs font-bold text-brand-rose transition-all duration-200 hover:-translate-y-0.5 hover:bg-brand-rose hover:text-white">Hủy đơn</button>` : ''}
            </div>
          </div>
        </article>`;
      }).join('');

      // Nút hủy đơn
      document.querySelectorAll('.cancel-btn').forEach(btn => btn.addEventListener('click', async () => {
        if (!confirm('Bạn chắc chắn muốn HỦY đơn đặt phòng này?')) return;
        btn.disabled = true; btn.textContent = 'Đang hủy…';
        try {
          await API.patch('/bookings/' + btn.dataset.bookingId + '/status', { status: 'cancelled' });
          UI.showToast('Đã hủy đơn đặt phòng');
          await loadBookings();
        } catch (err) {
          UI.showToast(API.serverMessage(err), 'error');
          await loadBookings();
        }
      }));
    }

    // Bộ lọc
    document.querySelectorAll('.filter-tab').forEach(tab => tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(t => {
        t.classList.remove('bg-brand-teal', 'text-white', 'shadow-soft');
        t.classList.add('bg-white', 'text-slate-600', 'ring-1', 'ring-slate-200');
      });
      tab.classList.add('bg-brand-teal', 'text-white', 'shadow-soft');
      tab.classList.remove('bg-white', 'text-slate-600', 'ring-1', 'ring-slate-200');
      currentFilter = tab.dataset.status;
      render();
    }));

    // ═══════════ Init ═══════════
    (async () => {
      await Auth.loadUser();
      if (!Auth.requireAuth('my-bookings.html')) return;
      UI.renderHeader('bookings');
      await loadBookings();
    })();
  </script>
  <script src="assets/chat.js"></script>
</body>
</html>
