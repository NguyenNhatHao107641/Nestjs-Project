<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hồ sơ cá nhân — StayNest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230D9488'/%3E%3Cpath d='M5 12l7-6 7 6M7.5 11v7h3.5v-4h2v4h3.5v-7' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { brand: { teal: '#0D9488', 'teal-dark': '#0F766E', 'teal-soft': '#F0FDFA', rose: '#F43F5E', 'rose-soft': '#FFF1F2' } },
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        boxShadow: { soft: '0 4px 24px -6px rgba(15, 23, 42, 0.08)', lift: '0 20px 40px -12px rgba(15, 23, 42, 0.16)', bar: '0 12px 40px -8px rgba(15, 23, 42, 0.18)' },
      } },
    };
  </script>
</head>

<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
  <div id="appHeader" class="sticky top-0 z-40 w-full border-b border-slate-100 bg-white/85 backdrop-blur-md"></div>

  <main class="mx-auto max-w-2xl px-4 py-10 sm:px-6">
    <div class="mb-8">
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 sm:text-3xl">Hồ sơ cá nhân</h1>
      <p class="mt-2 text-sm text-slate-500">Quản lý thông tin tài khoản StayNest của bạn.</p>
    </div>

    <!-- Loading -->
    <div id="loading" class="py-20 text-center">
      <div class="mx-auto h-10 w-10 animate-spin rounded-full border-4 border-slate-200 border-t-brand-teal"></div>
      <p class="mt-4 text-sm font-semibold text-slate-500">Đang tải hồ sơ…</p>
    </div>

    <!-- Nội dung -->
    <form id="profileForm" class="hidden space-y-6">
      <!-- Thẻ avatar -->
      <div class="flex items-center gap-5 rounded-3xl bg-white p-6 shadow-soft">
        <span id="avatarPreview" class="grid h-20 w-20 shrink-0 place-items-center overflow-hidden rounded-full bg-brand-teal text-2xl font-extrabold text-white"></span>
        <div class="min-w-0">
          <p id="profileName" class="truncate text-lg font-extrabold text-slate-900"></p>
          <p id="profileEmail" class="mt-0.5 truncate text-sm text-slate-500"></p>
          <span id="profileRole" class="mt-2 inline-flex items-center gap-1 rounded-full bg-brand-teal-soft px-3 py-1 text-[11px] font-bold text-brand-teal"></span>
        </div>
      </div>

      <div id="profileBanner" class="hidden rounded-xl border border-brand-rose/30 bg-brand-rose-soft px-4 py-3 text-sm font-semibold text-brand-rose"></div>
      <div id="profileSuccess" class="hidden rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700">✓ Đã cập nhật thông tin hồ sơ!</div>

      <!-- Form -->
      <div class="space-y-5 rounded-3xl bg-white p-6 shadow-soft">
        <div>
          <label for="pfFullName" class="mb-1.5 block text-sm font-bold text-slate-700">Họ và tên</label>
          <input id="pfFullName" type="text"
            class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium outline-none transition-all duration-200 focus:border-brand-teal focus:ring-2 focus:ring-brand-teal/20" />
          <p class="error hidden mt-1.5 text-xs font-semibold text-brand-rose"></p>
        </div>
        <div>
          <label for="pfPhone" class="mb-1.5 block text-sm font-bold text-slate-700">Số điện thoại</label>
          <input id="pfPhone" type="tel" placeholder="0901234567"
            class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium outline-none transition-all duration-200 focus:border-brand-teal focus:ring-2 focus:ring-brand-teal/20" />
          <p class="error hidden mt-1.5 text-xs font-semibold text-brand-rose"></p>
        </div>
        <div>
          <label for="pfAvatar" class="mb-1.5 block text-sm font-bold text-slate-700">Ảnh đại diện <span class="font-medium text-slate-400">(URL ảnh)</span></label>
          <input id="pfAvatar" type="url" placeholder="https://example.com/avatar.jpg"
            class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium outline-none transition-all duration-200 placeholder:text-slate-300 focus:border-brand-teal focus:ring-2 focus:ring-brand-teal/20" />
          <p class="mt-1.5 text-xs text-slate-400">Mẹo: dán link ảnh từ Unsplash để có avatar đẹp.</p>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-bold text-slate-700">Email</label>
          <input id="pfEmail" type="email" disabled
            class="w-full cursor-not-allowed rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm font-medium text-slate-500" />
          <p class="mt-1.5 text-xs text-slate-400">Email dùng để đăng nhập nên không thể thay đổi.</p>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-bold text-slate-700">Thành viên từ</label>
          <p id="memberSince" class="text-sm font-semibold text-slate-600"></p>
        </div>
      </div>

      <button type="submit" id="saveBtn"
        class="w-full rounded-xl bg-brand-teal py-4 text-sm font-bold text-white shadow-soft transition-all duration-200 hover:-translate-y-0.5 hover:bg-brand-teal-dark hover:shadow-lift active:translate-y-0 disabled:opacity-60">
        Lưu thay đổi
      </button>
    </form>
  </main>

  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/ui.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    let me = null;
    const PHONE_RE = /^(0|\+84)[3|5|7|8|9]\d{8}$/;

    function setError(id, msg) {
      const input = $('#' + id);
      // Tìm thẻ .error theo cây tổ tiên (tránh null khi input nằm trong wrapper riêng)
      let errEl = null, scope = input.parentElement;
      while (scope && scope !== document.body) { errEl = scope.querySelector('.error'); if (errEl) break; scope = scope.parentElement; }
      if (msg) {
        input.classList.remove('border-slate-200');
        input.classList.add('border-brand-rose', 'ring-2', 'ring-brand-rose/15');
        if (errEl) { errEl.textContent = '⚠ ' + msg; errEl.classList.remove('hidden'); }
      } else {
        input.classList.add('border-slate-200');
        input.classList.remove('border-brand-rose', 'ring-2', 'ring-brand-rose/15');
        if (errEl) errEl.classList.add('hidden');
      }
    }

    function avatarHTML(user, sizeCls) {
      return user.avatar
        ? `<img src="${UI.esc(user.avatar)}" class="${sizeCls} object-cover" alt="" />`
        : UI.esc(UI.initial(user.fullName));
    }

    function fillProfile(user) {
      me = user;
      $('#avatarPreview').innerHTML = avatarHTML(user, 'h-full w-full');
      $('#profileName').textContent = user.fullName;
      $('#profileEmail').textContent = user.email;
      $('#profileRole').innerHTML = `<svg class="h-3 w-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg> ${UI.esc(Auth.roleLabel(user.role))}`;
      $('#pfFullName').value = user.fullName;
      $('#pfPhone').value = user.phoneNumber || '';
      $('#pfAvatar').value = user.avatar || '';
      $('#pfEmail').value = user.email;
      $('#memberSince').textContent = UI.fmtDate(user.createdAt);
      $('#loading').classList.add('hidden');
      $('#profileForm').classList.remove('hidden');
    }

    ['pfFullName', 'pfPhone', 'pfAvatar'].forEach(id => $('#' + id).addEventListener('input', () => {
      setError(id, null);
      $('#profileSuccess').classList.add('hidden');
    }));

    // Xem trước avatar khi gõ
    $('#pfAvatar').addEventListener('change', () => {
      const url = $('#pfAvatar').value.trim();
      if (url) $('#avatarPreview').innerHTML = `<img src="${UI.esc(url)}" class="h-full w-full object-cover" alt="" />`;
    });

    $('#profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = $('#pfFullName').value.trim();
      const phone = $('#pfPhone').value.trim();
      const avatar = $('#pfAvatar').value.trim();

      let ok = true;
      setError('pfFullName', fullName.length >= 2 ? null : 'Họ tên tối thiểu 2 ký tự.');
      setError('pfPhone', !phone || PHONE_RE.test(phone) ? null : 'Số điện thoại không hợp lệ (VD: 0901234567).');
      if (document.querySelector('.error:not(.hidden)')) return;

      const btn = $('#saveBtn');
      btn.disabled = true; btn.textContent = 'Đang lưu…';
      try {
        const res = await API.patch('/users/' + me._id, {
          fullName,
          phoneNumber: phone,
          avatar,
        });
        me = res.data;
        Auth.saveUser(me);
        fillProfile(me);
        UI.renderHeader('profile');
        $('#profileSuccess').classList.remove('hidden');
        UI.showToast('Đã cập nhật hồ sơ!');
      } catch (err) {
        $('#profileBanner').textContent = '⚠ ' + API.serverMessage(err);
        $('#profileBanner').classList.remove('hidden');
      } finally {
        btn.disabled = false; btn.textContent = 'Lưu thay đổi';
      }
    });

    // ═══════════ Init ═══════════
    (async () => {
      await Auth.loadUser();
      if (!Auth.requireAuth('profile.html')) return;
      UI.renderHeader('profile');
      try {
        const res = await API.get('/users/me');
        fillProfile(res.data);
      } catch (err) {
        UI.showToast(API.serverMessage(err), 'error');
      }
    })();
  </script>
  <script src="assets/chat.js"></script>
</body>
</html>
