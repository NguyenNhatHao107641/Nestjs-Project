<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phòng yêu thích — StayNest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230D9488'/%3E%3Cpath d='M5 12l7-6 7 6M7.5 11v7h3.5v-4h2v4h3.5v-7' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { brand: { teal: '#0D9488', 'teal-dark': '#0F766E', 'teal-soft': '#F0FDFA', rose: '#F43F5E', 'rose-soft': '#FFF1F2' } },
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        boxShadow: { soft: '0 4px 24px -6px rgba(15, 23, 42, 0.08)', lift: '0 20px 40px -12px rgba(15, 23, 42, 0.16)', bar: '0 12px 40px -8px rgba(15, 23, 42, 0.18)' },
      } },
    };
  </script>
  <style>
    .card-img { transition: transform .2s ease; }
    .group:hover .card-img { transform: scale(1.06); }
    .skeleton { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  </style>
</head>

<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
  <div id="appHeader" class="sticky top-0 z-40 w-full border-b border-slate-100 bg-white/85 backdrop-blur-md"></div>

  <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
    <div class="mb-8">
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 sm:text-3xl">Phòng yêu thích</h1>
      <p id="favCount" class="mt-2 text-sm text-slate-500">Đang tải…</p>
    </div>

    <!-- Loading -->
    <div id="loading" class="py-20 text-center">
      <div class="mx-auto h-10 w-10 animate-spin rounded-full border-4 border-slate-200 border-t-brand-rose"></div>
      <p class="mt-4 text-sm font-semibold text-slate-500">Đang tải danh sách yêu thích…</p>
    </div>

    <!-- Danh sách -->
    <div id="favGrid" class="grid grid-cols-1 gap-7 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>

    <!-- Trạng thái rỗng -->
    <div id="emptyState" class="hidden rounded-3xl bg-white px-6 py-16 text-center shadow-soft">
      <span class="mx-auto grid h-16 w-16 place-items-center rounded-full bg-brand-rose-soft">
        <svg class="h-8 w-8 text-brand-rose" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
      </span>
      <h3 class="mt-5 text-xl font-extrabold text-slate-900">Chưa có phòng nào trong danh sách</h3>
      <p class="mx-auto mt-2 max-w-sm text-sm text-slate-500">Bấm nút ♥ trên các thẻ phòng để lưu lại những homestay bạn mê, rồi quay lại đây xem sau.</p>
      <a href="index.html" class="mt-6 inline-block rounded-xl bg-brand-teal px-8 py-3 text-sm font-bold text-white shadow-soft transition-all duration-200 hover:-translate-y-0.5 hover:bg-brand-teal-dark hover:shadow-lift">Khám phá homestay</a>
    </div>
  </main>

  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/ui.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    let rooms = [];

    async function loadFavorites() {
      try {
        const res = await API.get('/favorites');
        rooms = res.data || [];
      } catch (err) {
        UI.showToast(API.serverMessage(err), 'error');
        rooms = [];
      }
      render();
    }

    function render() {
      $('#loading').classList.add('hidden');
      $('#favCount').textContent = rooms.length
        ? `Bạn đã lưu ${rooms.length} homestay — bấm ♥ để bỏ khỏi danh sách`
        : 'Danh sách đang trống';
      $('#emptyState').classList.toggle('hidden', rooms.length !== 0);
      $('#favGrid').innerHTML = rooms.map((room, i) => UI.roomCard(room, i, {
        actions: UI.favBtnHTML(room._id, 'absolute bottom-3 right-3'),
      })).join('');

      // Click thẻ → trang chi tiết
      document.querySelectorAll('.room-card').forEach(card => card.addEventListener('click', () => {
        location.href = 'room.html?id=' + card.dataset.roomId;
      }));

      // Toggle yêu thích: bỏ thành công → gỡ thẻ khỏi grid
      UI.bindFavButtons($('#favGrid'), (id, favorited) => {
        if (!favorited) {
          rooms = rooms.filter(r => r._id !== id);
          $('#favCount').textContent = rooms.length
            ? `Bạn đã lưu ${rooms.length} homestay — bấm ♥ để bỏ khỏi danh sách`
            : 'Danh sách đang trống';
          $('#emptyState').classList.toggle('hidden', rooms.length !== 0);
          const card = document.querySelector('.room-card[data-room-id="' + id + '"]');
          if (card) card.remove();
        }
      });
    }

    // ═══════════ Init ═══════════
    (async () => {
      if (!Auth.requireAuth()) return;
      await Auth.loadUser();
      UI.renderHeader('favorites');
      await UI.favorites.load();
      await loadFavorites();
    })();
  </script>
</body>
</html>
